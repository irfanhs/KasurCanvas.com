name: Deploy KasurCanvas to Web via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger directly from GitHub Actions tab

jobs:
  web-deploy:
    name: Deploy to Live Server
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Enables delta/diff upload for fast sync

      - name: ⚙️ Generate Production Database Config from Secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME || secrets.DB_DATABASE || secrets.KasurCanvasDatabase || 'KasurCanvasDatabase' }}
          DB_USER: ${{ secrets.DB_USER || secrets.DB_USERNAME }}
          DB_PASS: ${{ secrets.DB_PASS || secrets.DB_PASSWORD }}
        run: |
          if [ -n "$DB_USER" ]; then
            echo "Generating production config/db_config.php..."
            cat << EOF > config/db_config.php
          <?php
          define('DB_HOST', '${DB_HOST:-localhost}');
          define('DB_PORT', '${DB_PORT:-3306}');
          define('DB_NAME', '${DB_NAME:-KasurCanvasDatabase}');
          define('DB_USER', '$DB_USER');
          define('DB_PASS', '$DB_PASS');
          EOF
          else
            echo "Note: DB_USER secret not detected, skipping db_config.php generation."
          fi

      - name: 🔑 Resolve FTP Credentials
        id: ftp_creds
        env:
          FTP_RAW: ${{ secrets.FTP }}
        run: |
          SERVER="${{ secrets.FTP_SERVER || secrets.FTP_HOST || '64.20.37.138' }}"
          USER="${{ secrets.FTP_USERNAME || secrets.FTP_USER || '' }}"
          PASS="${{ secrets.FTP_PASSWORD || secrets.FTP_PASS || '' }}"
          PORT="${{ secrets.FTP_PORT || '21' }}"

          if [ -n "$FTP_RAW" ]; then
            PARSED_HOST=$(echo "$FTP_RAW" | grep -i 'Hostname:' | sed -e 's/.*Hostname:[[:space:]]*//I' | tr -d '\r')
            PARSED_USER=$(echo "$FTP_RAW" | grep -i 'Username:' | sed -e 's/.*Username:[[:space:]]*//I' | tr -d '\r')
            PARSED_PASS=$(echo "$FTP_RAW" | grep -i 'Password:' | sed -e 's/.*Password:[[:space:]]*//I' | tr -d '\r')
            PARSED_PORT=$(echo "$FTP_RAW" | grep -i 'Port:' | sed -e 's/.*Port:[[:space:]]*//I' | tr -d '\r')

            [ -n "$PARSED_HOST" ] && SERVER="$PARSED_HOST"
            [ -n "$PARSED_USER" ] && USER="$PARSED_USER"
            [ -n "$PARSED_PASS" ] && PASS="$PARSED_PASS"
            [ -n "$PARSED_PORT" ] && PORT="$PARSED_PORT"
          fi

          echo "server=$SERVER" >> $GITHUB_OUTPUT
          echo "username=$USER" >> $GITHUB_OUTPUT
          echo "password=$PASS" >> $GITHUB_OUTPUT
          echo "port=$PORT" >> $GITHUB_OUTPUT

      - name: 📂 Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp_creds.outputs.server }}
          username: ${{ steps.ftp_creds.outputs.username }}
          password: ${{ steps.ftp_creds.outputs.password }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          port: ${{ steps.ftp_creds.outputs.port }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            AI Code.txt
            database.sql
            .env

