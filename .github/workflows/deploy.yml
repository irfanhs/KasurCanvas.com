name: Deploy KasurCanvas to Web via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger directly from GitHub Actions tab

jobs:
  web-deploy:
    name: Deploy to Live Server
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Enables delta/diff upload for fast sync

      - name: ⚙️ Generate Production Database Config from Secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME || secrets.DB_DATABASE || secrets.KasurCanvasDatabase || 'KasurCanvasDatabase' }}
          DB_USER: ${{ secrets.DB_USER || secrets.DB_USERNAME }}
          DB_PASS: ${{ secrets.DB_PASS || secrets.DB_PASSWORD }}
        run: |
          if [ -n "$DB_USER" ]; then
            echo "Generating production config/db_config.php..."
            cat << EOF > config/db_config.php
          <?php
          define('DB_HOST', '${DB_HOST:-localhost}');
          define('DB_PORT', '${DB_PORT:-3306}');
          define('DB_NAME', '${DB_NAME:-KasurCanvasDatabase}');
          define('DB_USER', '$DB_USER');
          define('DB_PASS', '$DB_PASS');
          EOF
          else
            echo "Note: DB_USER secret not detected, skipping db_config.php generation."
          fi

      - name: 📂 Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || secrets.FTP_HOST || secrets.SERVER || 'ftp.kasurcanvas.com' }}
          username: ${{ secrets.FTP_USERNAME || secrets.FTP_USER || secrets.USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || secrets.FTP_PASS || secrets.PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            AI Code.txt
            database.sql
            .env
